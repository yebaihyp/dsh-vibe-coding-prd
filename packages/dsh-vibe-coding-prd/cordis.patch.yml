# dsh-vibe-coding-prd 的补丁层：把插件行插入当前 profile 的组合。
#
# id 与 name 都用插件包名 dsh-vibe-coding-prd：id 是 profile 里这一行的标识，
# name 是宿主解析插件包用的包名（必须与 package.json 的 name 一致）。
# 从 npm 装、从 GitHub 子目录装、从本机路径装都走同一条记录。
# 本插件没有 Config 字段，config 留空对象即可；要改运行参数就在这里加。
- insert:
    - id: dsh-vibe-coding-prd
      name: dsh-vibe-coding-prd
      config: {}
